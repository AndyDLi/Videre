# Confirms the self-hosted runner works and holds exactly the cluster access it should.
# Triggered the same way the real deploy job will be: pushes to main only, never pull
# requests, so code from an outside contributor's fork can never reach this machine.

name: Runner Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, videre-deploy]
    steps:
      - name: Report the runner environment
        run: |
          echo "host: $(hostname)"
          echo "user: $(whoami)"
          echo "kubeconfig: ${KUBECONFIG}"
          kubectl version --client

      - name: Confirm the deploy identity can reach its own namespace
        run: |
          kubectl get deployments
          test "$(kubectl auth can-i patch deployments || true)" = "yes"
          test "$(kubectl auth can-i get pods || true)" = "yes"

      - name: Confirm the deploy identity is denied everything else
        run: |
          test "$(kubectl auth can-i get secrets || true)" = "no"
          test "$(kubectl auth can-i delete deployments || true)" = "no"
          test "$(kubectl auth can-i create pods || true)" = "no"
          test "$(kubectl auth can-i get pods --namespace kube-system || true)" = "no"
          echo "cluster access is correctly limited to the videre namespace"
