# Smoke-test, test, build, push, and deploy.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/andydli/videre

jobs:
  test-python:
    name: Test backend and simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check .

      - name: Test
        run: npx vitest run

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the simulator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: simulator
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-simulator:${{ github.sha }}
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,mode=max,scope=simulator

      - name: Build and push the backend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push the frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to the cluster
    runs-on: [self-hosted, videre-deploy]
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Report the runner environment
        run: |
          echo "host: $(hostname)"
          echo "user: $(whoami)"
          echo "kubeconfig: ${KUBECONFIG}"
          kubectl version --client

      - name: Confirm the deploy identity can reach its own namespace
        run: |
          kubectl get deployments
          test "$(kubectl auth can-i patch deployments || true)" = "yes"
          test "$(kubectl auth can-i get pods || true)" = "yes"

      - name: Confirm the deploy identity is denied everything else
        run: |
          test "$(kubectl auth can-i get secrets || true)" = "no"
          test "$(kubectl auth can-i delete deployments || true)" = "no"
          test "$(kubectl auth can-i create pods || true)" = "no"
          test "$(kubectl auth can-i get pods --namespace kube-system || true)" = "no"
          echo "cluster access is correctly limited to the videre namespace"

      - name: Point each Deployment at the new commit
        run: |
          kubectl set image deployment/simulator simulator=${{ env.IMAGE_PREFIX }}-simulator:${{ github.sha }}
          kubectl set image deployment/backend backend=${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          kubectl set image deployment/frontend frontend=${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Wait for each rollout to become ready
        run: |
          kubectl rollout status deployment/simulator --timeout=180s
          kubectl rollout status deployment/backend --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Report what is running
        if: always()
        run: kubectl get pods -o wide
