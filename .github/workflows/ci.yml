name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: videre-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/andydli/videre

jobs:
  test-python:
    name: Test backend and simulator
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_DB: videre_test
          POSTGRES_PASSWORD: ci_postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d videre_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci_postgres@127.0.0.1:5432/videre_test
      VIDERE_TEST_DATABASE_URL: postgresql+asyncpg://videre_app:ci_videre_app@127.0.0.1:5432/videre_test
      VIDERE_REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Migrate the empty test database and bootstrap application access
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current --check-heads
          docker exec -i ${{ job.services.postgres.id }} psql -X -U postgres -d videre_test \
            -v database_name=videre_test < scripts/bootstrap-postgres.sql
          docker exec ${{ job.services.postgres.id }} psql -X -v ON_ERROR_STOP=1 -U postgres -d videre_test \
            -c "ALTER ROLE videre_app PASSWORD 'ci_videre_app'"

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  check-frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check .

  check-manifests:
    name: Check Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render the kustomization
        run: kubectl kustomize k8s/ > /dev/null

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [test-python, check-frontend, check-manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    outputs:
      python_version: ${{ steps.versions.outputs.python_version }}
      frontend_version: ${{ steps.versions.outputs.frontend_version }}
      short_sha: ${{ steps.versions.outputs.short_sha }}
      record_sha: ${{ steps.record.outputs.record_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read the project versions
        id: versions
        run: |
          python_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          frontend_version=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          short_sha=${GITHUB_SHA:0:7}
          echo "python_version=${python_version}" >> "$GITHUB_OUTPUT"
          echo "frontend_version=${frontend_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "backend and simulator: ${python_version}-${short_sha}"
          echo "frontend: ${frontend_version}-${short_sha}"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the simulator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: simulator
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-simulator:${{ steps.versions.outputs.python_version }}-${{ steps.versions.outputs.short_sha }}
          provenance: false
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,mode=max,scope=simulator

      - name: Build and push the backend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ steps.versions.outputs.python_version }}-${{ steps.versions.outputs.short_sha }}
          provenance: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push the frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.versions.outputs.frontend_version }}-${{ steps.versions.outputs.short_sha }}
          provenance: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Record the desired image tags in git
        id: record
        run: |
          set -euo pipefail
          current=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Release superseded before image recording: main is $current" >&2
            exit 1
          fi
          backend="${IMAGE_PREFIX}-backend:${{ steps.versions.outputs.python_version }}-${{ steps.versions.outputs.short_sha }}"
          frontend="${IMAGE_PREFIX}-frontend:${{ steps.versions.outputs.frontend_version }}-${{ steps.versions.outputs.short_sha }}"
          simulator="${IMAGE_PREFIX}-simulator:${{ steps.versions.outputs.python_version }}-${{ steps.versions.outputs.short_sha }}"

          sed -i -E "s|image: ${IMAGE_PREFIX}-backend:.*|image: ${backend}|" k8s/backend/30-deployment.yaml
          sed -i -E "s|image: ${IMAGE_PREFIX}-frontend:.*|image: ${frontend}|" k8s/frontend/30-deployment.yaml
          sed -i -E "s|image: ${IMAGE_PREFIX}-simulator:.*|image: ${simulator}|" k8s/simulator/20-deployment.yaml

          grep -q "image: ${backend}$" k8s/backend/30-deployment.yaml
          grep -q "image: ${frontend}$" k8s/frontend/30-deployment.yaml
          grep -q "image: ${simulator}$" k8s/simulator/20-deployment.yaml

          if git diff --quiet; then
            echo "manifests already record these tags"
            echo "record_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          else
            diff_status=$?
            [ "$diff_status" -eq 1 ] || exit "$diff_status"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/30-deployment.yaml k8s/frontend/30-deployment.yaml k8s/simulator/20-deployment.yaml
          git commit -m "Record desired image tags for ${{ steps.versions.outputs.short_sha }}"
          git push origin HEAD:main
          echo "record_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to the cluster
    runs-on: [self-hosted, videre-deploy]
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RECORD_SHA: ${{ needs.build-and-push.outputs.record_sha }}
      PYTHON_TAG: ${{ needs.build-and-push.outputs.python_version }}-${{ needs.build-and-push.outputs.short_sha }}
      FRONTEND_TAG: ${{ needs.build-and-push.outputs.frontend_version }}-${{ needs.build-and-push.outputs.short_sha }}
    steps:
      - name: Report the runner environment
        run: |
          echo "host: $(hostname)"
          echo "user: $(whoami)"
          echo "kubeconfig: ${KUBECONFIG}"
          kubectl version --client

      - name: Confirm the deploy identity can reach its own namespace
        run: |
          kubectl get deployments
          for deployment in backend simulator frontend; do
            test "$(kubectl auth can-i patch deployment/$deployment || true)" = "yes"
          done
          test "$(kubectl auth can-i list pods || true)" = "yes"

      - name: Confirm the deploy identity is denied everything else
        run: |
          test "$(kubectl auth can-i get secrets || true)" = "no"
          test "$(kubectl auth can-i patch deployment/postgres || true)" = "no"
          test "$(kubectl auth can-i update deployment/backend || true)" = "no"
          test "$(kubectl auth can-i delete deployments || true)" = "no"
          test "$(kubectl auth can-i create pods || true)" = "no"
          test "$(kubectl auth can-i get pods --namespace kube-system || true)" = "no"
          echo "cluster access is correctly limited to the videre namespace"

      # The consumer must understand new simulator envelopes before they are published.
      - name: Deploy ordered application images and record verified rollout
        run: |
          set -euo pipefail
          test -n "$RECORD_SHA"
          rollout() {
            local name="$1" image="$2" current actual
            current=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
            if [ "$current" != "$RECORD_SHA" ]; then
              echo "Release superseded before $name: main is $current" >&2
              return 1
            fi
            kubectl set image "deployment/$name" "$name=$image"
            kubectl rollout status "deployment/$name" --timeout=180s
            actual=$(kubectl get deployment "$name" -o "jsonpath={.spec.template.spec.containers[?(@.name=='$name')].image}")
            test "$actual" = "$image"
          }
          backend="${IMAGE_PREFIX}-backend:${PYTHON_TAG}"
          simulator="${IMAGE_PREFIX}-simulator:${PYTHON_TAG}"
          frontend="${IMAGE_PREFIX}-frontend:${FRONTEND_TAG}"
          rollout backend "$backend"
          rollout simulator "$simulator"
          rollout frontend "$frontend"
          {
            printf 'Verified application rollout\n\nSource: `%s`\n\nDesired record: `%s`\n\n' "$GITHUB_SHA" "$RECORD_SHA"
            printf -- '- Backend: `%s`\n- Simulator: `%s`\n- Frontend: `%s`\n\n' "$backend" "$simulator" "$frontend"
            printf '[Workflow run](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report what is running
        if: always()
        run: kubectl get pods -o wide
