name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/andydli/videre

jobs:
  test-python:
    name: Test backend and simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  check-frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Check formatting
        run: npx prettier --check .

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [test-python, check-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      python_version: ${{ steps.versions.outputs.python_version }}
      frontend_version: ${{ steps.versions.outputs.frontend_version }}
      short_sha: ${{ steps.versions.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the project versions
        id: versions
        run: |
          python_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          frontend_version=$(python3 -c "import json; print(json.load(open('frontend/package.json'))['version'])")
          short_sha=${GITHUB_SHA:0:7}
          echo "python_version=${python_version}" >> "$GITHUB_OUTPUT"
          echo "frontend_version=${frontend_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "backend and simulator: ${python_version}-${short_sha}"
          echo "frontend: ${frontend_version}-${short_sha}"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the simulator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: simulator
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-simulator:${{ steps.versions.outputs.python_version }}-${{ steps.versions.outputs.short_sha }}
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,mode=max,scope=simulator

      - name: Build and push the backend
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-backend:${{ steps.versions.outputs.python_version }}-${{ steps.versions.outputs.short_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push the frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.versions.outputs.frontend_version }}-${{ steps.versions.outputs.short_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to the cluster
    runs-on: [self-hosted, videre-deploy]
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      PYTHON_TAG: ${{ needs.build-and-push.outputs.python_version }}-${{ needs.build-and-push.outputs.short_sha }}
      FRONTEND_TAG: ${{ needs.build-and-push.outputs.frontend_version }}-${{ needs.build-and-push.outputs.short_sha }}
    steps:
      - name: Report the runner environment
        run: |
          echo "host: $(hostname)"
          echo "user: $(whoami)"
          echo "kubeconfig: ${KUBECONFIG}"
          kubectl version --client

      - name: Confirm the deploy identity can reach its own namespace
        run: |
          kubectl get deployments
          test "$(kubectl auth can-i patch deployments || true)" = "yes"
          test "$(kubectl auth can-i get pods || true)" = "yes"

      - name: Confirm the deploy identity is denied everything else
        run: |
          test "$(kubectl auth can-i get secrets || true)" = "no"
          test "$(kubectl auth can-i delete deployments || true)" = "no"
          test "$(kubectl auth can-i create pods || true)" = "no"
          test "$(kubectl auth can-i get pods --namespace kube-system || true)" = "no"
          echo "cluster access is correctly limited to the videre namespace"

      - name: Point each Deployment at the new build
        run: |
          kubectl set image deployment/simulator simulator=${{ env.IMAGE_PREFIX }}-simulator:${{ env.PYTHON_TAG }}
          kubectl set image deployment/backend backend=${{ env.IMAGE_PREFIX }}-backend:${{ env.PYTHON_TAG }}
          kubectl set image deployment/frontend frontend=${{ env.IMAGE_PREFIX }}-frontend:${{ env.FRONTEND_TAG }}

      - name: Wait for each rollout to become ready
        run: |
          kubectl rollout status deployment/simulator --timeout=180s
          kubectl rollout status deployment/backend --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Report what is running
        if: always()
        run: kubectl get pods -o wide
