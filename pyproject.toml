[project]
name = "videre"
version = "0.7.0"
description = "Videre AI cluster operations and debugging console"
requires-python = ">=3.12"
dependencies = [
    "aiokafka[lz4]>=0.14.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "confluent-kafka>=2.15.0",
    "fastapi>=0.140.0",
    "google-genai>=2.14.0",
    "httpx2>=2.9.1",
    "kubernetes>=36.0.3",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.14.2",
    "redis>=8.0.1",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videre"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.6",
    "websockets>=16.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "confluent_kafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kubernetes.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true
