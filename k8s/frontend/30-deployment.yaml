# React dashboard: built ahead of time and served as static files by Nginx.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: videre
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: videre
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: videre
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: ghcr.io/andydli/videre-frontend:0.9.2-bd07fa2
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
