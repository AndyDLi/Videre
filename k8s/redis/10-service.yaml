# Internal, stable network address for Redis.

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: videre
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: videre
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
