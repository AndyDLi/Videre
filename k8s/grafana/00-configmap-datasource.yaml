# Automatically create the Prometheus and Loki data sources in Grafana on startup.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: videre
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: videre
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 30
