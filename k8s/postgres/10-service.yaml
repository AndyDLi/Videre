# Internal, stable network address for PostgreSQL.

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: videre
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: videre
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
