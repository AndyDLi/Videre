# Cluster identity for the CI deploy job.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: videre-deployer
  namespace: videre
  labels:
    app.kubernetes.io/name: ci
    app.kubernetes.io/part-of: videre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: videre-deployer
  namespace: videre
  labels:
    app.kubernetes.io/part-of: videre
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: videre-deployer
  namespace: videre
  labels:
    app.kubernetes.io/part-of: videre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: videre-deployer
subjects:
  - kind: ServiceAccount
    name: videre-deployer
    namespace: videre
---
apiVersion: v1
kind: Secret
metadata:
  name: videre-deployer-token
  namespace: videre
  annotations:
    kubernetes.io/service-account.name: videre-deployer
  labels:
    app.kubernetes.io/part-of: videre
type: kubernetes.io/service-account-token
