# Non-secret backend settings.
# All connections is a Kubernetes Service DNS name, injected as an environment variable.

apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: videre
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: videre
data:
  VIDERE_POSTGRES_HOST: "postgres.videre.svc.cluster.local"
  VIDERE_POSTGRES_PORT: "5432"
  VIDERE_POSTGRES_DATABASE: "videre"
  VIDERE_REDIS_HOST: "redis.videre.svc.cluster.local"
  VIDERE_REDIS_PORT: "6379"
  VIDERE_KAFKA_BOOTSTRAP_SERVERS: "kafka.videre.svc.cluster.local:9092"
  VIDERE_CACHE_REFRESH_INTERVAL_SECONDS: "5"
  VIDERE_PROMETHEUS_BASE_URL: "http://prometheus.videre.svc.cluster.local:9090"
  VIDERE_LOKI_BASE_URL: "http://loki.videre.svc.cluster.local:3100"
  VIDERE_AI_SOURCE_TIMEOUT_SECONDS: "3"
  VIDERE_AI_METRIC_WINDOW_MINUTES: "15"
  VIDERE_AI_LOG_WINDOW_MINUTES: "15"
  VIDERE_AI_LOG_LINE_LIMIT: "50"
  VIDERE_GEMINI_MODEL: "gemini-3.5-flash-lite"
  VIDERE_GEMINI_TIMEOUT_SECONDS: "20"
  VIDERE_GEMINI_MAXIMUM_ATTEMPTS: "3"
  VIDERE_GEMINI_MAXIMUM_PROMPT_CHARACTERS: "24000"
