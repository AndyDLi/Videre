# The backend, deployed in-cluster. Reaches Postgres/Redis/Kafka by service DNS.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: videre
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: videre
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate    # recreate not rolling; avoid more than one Kafka consumer group member
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: videre
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: ghcr.io/andydli/videre-backend:0.9.0-a5abf2e
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: VIDERE_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app-secret
                  key: POSTGRES_APP_USER
            - name: VIDERE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-secret
                  key: POSTGRES_APP_PASSWORD
            - name: VIDERE_GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: GEMINI_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3